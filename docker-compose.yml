services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dispatcher
      POSTGRES_PASSWORD: dispatcher
      POSTGRES_DB: webhook_dispatcher
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatcher -d webhook_dispatcher"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dispatcher:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Inside the compose network, use service names and internal ports.
      DATABASE_URL: postgres://dispatcher:dispatcher@postgres:5432/webhook_dispatcher?sslmode=disable
      REDIS_ADDR: redis:6379
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      # Secrets are injected from the local .env (not committed).
      JWT_SECRET: ${JWT_SECRET}
      INGEST_TOKEN: ${INGEST_TOKEN}
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redisdata: